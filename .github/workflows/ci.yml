name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -race is a requirement, not a local habit: see wiki/contributing/conventions.md.
      - name: test
        run: go test -race ./...
